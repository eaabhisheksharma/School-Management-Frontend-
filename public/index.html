<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="School Management System - Manage students, teachers, classes, attendance, fees and more."
    />
    <meta name="author" content="School Management SAA" />
    <meta property="og:title" content="School Management System" />
    <meta property="og:description" content="Complete school management portal for principals, teachers, students and parents." />
    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>School Management System</title>

    <style>
      /* Initial loading screen before React mounts */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        font-size: 52px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loader-title {
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .loader-subtitle {
        color: #64748b;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        margin-bottom: 40px;
      }

      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(37, 99, 235, 0.2);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      /* Base reset before CSS loads */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Inter, sans-serif;
        text-align: center;
        padding: 20px;
        background: #0f172a;
        color: #ffffff;
      ">
        <div>
          <div style="font-size: 48px; margin-bottom: 16px;">🎓</div>
          <h1 style="font-size: 24px; margin-bottom: 8px;">JavaScript Required</h1>
          <p style="color: #64748b; font-size: 16px;">
            Please enable JavaScript to run the School Management System.
          </p>
        </div>
      </div>
    </noscript>

    <!-- Initial Loader (hidden once React mounts) -->
    <div id="initial-loader">
      <div class="loader-logo">🎓</div>
      <div class="loader-title">School Management System</div>
      <div class="loader-subtitle">Loading your portal...</div>
      <div class="loader-spinner"></div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <!-- Hide loader once React is ready -->
    <script>
      window.addEventListener('load', function () {
        // Small delay to ensure React has rendered
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function () {
              loader.remove();
            }, 400);
          }
        }, 500);
      });
    </script>
  </body>
</html>
